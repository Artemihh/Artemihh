name: Vampire Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate crimson contribution animation
        uses: Platane/snk@v3
        with:
          github_user_name: Artemihh
          outputs: |
            dist/github-snake.svg?color_snake=%23dc143c&color_dots=%230d1117,%233b0a0a,%237f1d1d,%23b91c1c,%23ff4d4d
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23dc143c&color_dots=%230d1117,%233b0a0a,%237f1d1d,%23b91c1c,%23ff4d4d

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
